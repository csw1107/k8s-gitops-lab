apiVersion: v1
kind: Service
metadata:
  name: ubuntu
  labels:
    app: ubuntu
spec:
  clusterIP: None
  selector:
    app: ubuntu
  ports:
    - name: ssh
      port: 22
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ubuntu
  labels:
    app: ubuntu
spec:
  serviceName: ubuntu
  replicas: 1
  selector:
    matchLabels:
      app: ubuntu
  template:
    metadata:
      labels:
        app: ubuntu
    spec:
      containers:
      - name: ubuntu
        image: docker.io/library/ubuntu:24.04
        command: ["/bin/sh","-c","sleep infinity"]
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
